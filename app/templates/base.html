<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  {# Tailwind (browser build) and HTMX from a CDN keep the project free of a Node build step. #}
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <nav class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-6">
        <a href="/" class="text-lg font-semibold text-indigo-600">{{ app_name }}</a>
        {% if user and user.is_admin %}
          <a href="/users" class="text-sm text-slate-600 hover:text-slate-900">Users</a>
        {% endif %}
      </div>
      {% if user %}
        <div class="flex items-center gap-3 text-sm">
          <span class="text-slate-600">{{ user.name }}</span>
          <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-500">{{ user.role.value|replace('_', ' ') }}</span>
          <form method="post" action="/logout">
            <button class="text-slate-500 hover:text-slate-900">Log out</button>
          </form>
        </div>
      {% endif %}
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
