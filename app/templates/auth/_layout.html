{% extends "base.html" %}

{# Shared centred card for the login and signup pages. #}
{% block content %}
<div class="mx-auto mt-12 max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-xl font-semibold">{% block heading %}{% endblock %}</h1>

  {% if error %}
    <p class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>
  {% endif %}

  {% block form %}{% endblock %}
</div>
{% endblock %}
