{% extends "base.html" %}

{% block content %}
<section class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-semibold">Welcome to {{ app_name }}, {{ user.name }}</h1>
  <p class="mt-2 text-slate-600">Your dashboard will live here. For now, jump straight in:</p>

  <div class="mt-6 flex flex-wrap gap-3">
    <a href="/companies" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Companies</a>
    <a href="/contacts" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Contacts</a>
    <button class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-50"
            hx-get="/health" hx-target="#health" hx-swap="innerHTML">
      Check system health
    </button>
  </div>
  <pre id="health" class="mt-4 text-sm text-slate-600"></pre>
</section>
{% endblock %}
