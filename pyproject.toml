[project]
name = "pycrm"
version = "0.1.0"
description = "A simple CRM built with FastAPI, SQLAlchemy, HTMX and PostgreSQL."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
